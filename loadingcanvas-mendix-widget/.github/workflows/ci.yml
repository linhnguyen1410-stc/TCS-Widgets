name: CI
on:
  push:
    # The active default branch is master; main/release/* kept for future renames.
    branches: [main, master, release/*]
  pull_request:
    # Keep in sync with push so PRs targeting release branches are also checked.
    branches: [main, master, release/*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bound CI runtime; without this a hung step burns the 360-minute default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Doc Links Check
        run: npm run check:docs

      - name: Documentation Consistency Check
        env:
          DOCS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && github.event.repository.default_branch || github.event.before) }}
          DOCS_HEAD_SHA: ${{ github.sha }}
        run: npm run docs:check

      - name: Changelog Check
        run: npm run check:changelog

      - name: Import Bans Check
        run: npm run check:imports

      - name: Script Tests
        run: npm run test:scripts

      - name: Unit Tests
        run: npm test

      - name: Build
        id: build
        run: npm run build

      - name: Upload build artifact
        # Upload only when the build actually produced dist/; `always()` here would
        # upload an empty artifact whenever an earlier check failed and Build was skipped.
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: widget-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
